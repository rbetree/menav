<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>menav · 动态后台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236a89c9'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E"
    />
    <script>
      // 首帧前落定主题,避免浅色用户先看到深色再闪成浅色。
      (function () {
        var saved = localStorage.getItem('admin-theme');
        var light = saved
          ? saved === 'light'
          : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (light) document.documentElement.classList.add('light-theme');
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="admin-shell">
      <!-- ==================== 侧边栏 ==================== -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">M</span>
          <div class="brand-text">
            <span class="brand-name">menav</span>
            <span class="brand-tag">动态后台</span>
          </div>
        </div>
        <nav class="side-nav" aria-label="主导航">
          <a class="side-link" href="#publish-status" data-nav="overview">
            <span class="side-icon" aria-hidden="true">◉</span>
            <span>概览</span>
          </a>
          <a class="side-link" href="#tree-root" data-nav="pages">
            <span class="side-icon" aria-hidden="true">⊞</span>
            <span>页面管理</span>
          </a>
          <a class="side-link" data-action="open-import" href="#tree-root">
            <span class="side-icon" aria-hidden="true">⇪</span>
            <span>导入书签</span>
          </a>
          <a class="side-link" data-action="open-settings" href="#publish-status">
            <span class="side-icon" aria-hidden="true">⚙</span>
            <span>数据与备份</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <span class="sidebar-hint">由 Cloudflare Access 保护</span>
          <button
            type="button"
            class="theme-toggle"
            id="theme-toggle"
            aria-label="切换主题"
            title="切换主题"
          ></button>
        </div>
      </aside>

      <!-- ==================== 主区域 ==================== -->
      <div class="admin-main">
        <header class="topbar">
          <div class="topbar-title">
            <h1>管理台</h1>
            <p class="topbar-subtitle">修改会在 5 分钟内自动发布；需立即生效请点「立即发布」</p>
          </div>
          <div class="header-actions">
            <button
              type="button"
              class="btn"
              id="btn-refresh"
              data-action="refresh"
              title="重新加载数据"
            >
              ↻ 刷新
            </button>
            <button type="button" class="btn" data-action="settings">⚙ 数据与备份</button>
            <button type="button" class="btn" data-action="export-backup">⤓ 导出备份</button>
            <button type="button" class="btn" id="btn-import" data-action="import">
              ⇪ 导入书签
            </button>
            <button type="button" class="btn" data-action="add-page">＋ 新增页面</button>
            <button type="button" class="btn btn-primary" id="btn-publish" data-action="publish">
              立即发布
            </button>
          </div>
        </header>

        <!-- 搜索 / 定位 -->
        <div class="toolbar">
          <label class="search-box">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input
              type="search"
              id="tree-search"
              placeholder="搜索站点 / 分类 / 页面…"
              autocomplete="off"
              aria-label="搜索站点、分类或页面"
            />
            <button
              type="button"
              class="search-clear"
              id="tree-search-clear"
              aria-label="清空搜索"
              hidden
            >
              ×
            </button>
          </label>
          <span class="search-count" id="tree-search-count" role="status" aria-live="polite"></span>
        </div>

        <!-- 发布状态 -->
        <section class="publish-status" role="status" aria-live="polite" id="publish-status">
          正在读取发布状态…
        </section>

        <!-- 加载中 / 脱机 / 错误 / 空数据 -->
        <div id="status" class="status-notice" role="status" aria-live="polite" hidden>
          <span class="status-icon"></span>
          <span class="status-text"></span>
        </div>

        <!-- 树根：由 app.js 渲染 页面 → 分类 → 站点 -->
        <main id="tree-root" class="tree-root"></main>
      </div>
    </div>

    <!-- 通用弹窗(新增/编辑站点·分类·页面 / 删除确认 / 书签导入) -->
    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button type="button" class="modal-close" data-action="modal-close" aria-label="关闭">
            ×
          </button>
        </div>
        <div class="modal-body">
          <div id="modal-content"></div>
        </div>
      </div>
    </div>

    <!-- Toast 容器 -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
