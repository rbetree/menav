name: Deploy Backend

# 代码推送到以下分支且改动涉及后端/管理台时,自动检查并部署 Worker。
# 需要仓库 Secrets:CLOUDFLARE_API_TOKEN(Workers Scripts:Edit)、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: [main, feat/dynamic-backend, codex/cloudflare-test]
    paths:
      - 'workers/**'
      - 'admin/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

# 部署不并发取消,避免产生半成品版本。
concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Install worker dependencies
        run: npm --prefix workers ci

      - name: Type check
        run: npm --prefix workers run check

      - name: Integration tests
        run: npm --prefix workers test

      - name: Deploy worker (staging)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --env staging
