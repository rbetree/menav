name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_contract:
        description: 'Run browser contract with Playwright'
        required: false
        default: false
        type: boolean

# 默认只读；使用 dorny/paths-filter 的 job 额外声明 pull-requests: read
permissions:
  contents: read

jobs:
  build_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check (changed files)
        run: npm run format:check:changed

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Fast check
        run: npm run check

      - name: Detect browser contract paths
        id: browser_paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            browser_contract:
              - 'assets/style.css'
              - 'assets/styles/**'
              - 'assets/pinyin-match.ts'
              - 'config/_default/**'
              - 'src/components/**'
              - 'src/layouts/**'
              - 'src/pages/**'
              - 'src/lib/search-index/**'
              - 'src/runtime/**'
              - 'src/lib/site-model/**'
              - 'src/lib/site-data/**'
              - 'src/lib/config/**'
              - 'src/lib/bookmarks/**'
              - 'src/lib/view-data/**'
              - 'src/types/**'
              - 'src/shared/**'
              - 'content/**'
              - 'scripts/lib/public-assets.ts'
              - 'scripts/lib/runtime-bundle.ts'
              - 'scripts/lib/search-index-assets.ts'
              - 'scripts/build-runtime.ts'
              - 'scripts/prepare-astro-public.ts'
              - 'test/browser/**'

      - name: Install Playwright browsers
        if: ${{ github.repository == 'rbetree/menav' && (steps.browser_paths.outputs.browser_contract == 'true' || (github.event_name == 'workflow_dispatch' && inputs.browser_contract)) }}
        run: npx playwright install --with-deps chromium

      - name: Browser contract
        if: ${{ github.repository == 'rbetree/menav' && (steps.browser_paths.outputs.browser_contract == 'true' || (github.event_name == 'workflow_dispatch' && inputs.browser_contract)) }}
        run: npm run check:browser

  build_test_node22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fast check on minimum supported Node
        run: npm run check

  backend_check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          # 同时缓存根目录与 workers 子目录的依赖
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Install workers dependencies
        run: npm --prefix workers ci

      - name: Install root dependencies
        run: npm ci

      - name: Workers dependency audit
        run: npm --prefix workers audit --omit=dev --audit-level=high

      - name: Workers type check
        run: npm --prefix workers run check

      - name: Validate example wrangler configurations
        run: npm run backend:check:configs

      - name: Workers integration tests
        run: npm run backend:test

      - name: Detect backend paths
        id: backend_paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            backend:
              - 'workers/**'
              - 'admin/**'
              - 'src/lib/config/**'
              - 'src/lib/bookmarks/**'
              - 'src/lib/security/**'
              - 'src/lib/cache/**'
              - 'src/lib/site-data/**'
              - 'src/lib/github/**'
              - 'src/shared/**'
              - 'src/types/**'
              - 'src/pages/**'
              - 'src/layouts/**'
              - 'src/components/**'
              - 'src/runtime/**'
              - 'astro.config.mjs'
              - 'scripts/sync*.ts'
              - 'scripts/backend-*.ts'
              - 'scripts/build-snapshot.ts'
              - 'scripts/build-runtime.ts'
              - 'scripts/generate-seed.ts'
              - 'scripts/prepare-astro-public.ts'
              - 'scripts/pages-create.ts'
              - 'scripts/check-example-configs.ts'
              - 'scripts/lib/build-pipeline.ts'
              - 'scripts/lib/backend-config.ts'
              - 'scripts/lib/public-assets.ts'
              - 'scripts/lib/runtime-bundle.ts'
              - 'scripts/lib/search-index-assets.ts'
              - 'scripts/lib/seed.ts'
              - 'config/_default/**'
              - 'content/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'workers/package.json'
              - 'workers/package-lock.json'
              - '.github/workflows/ci.yml'

      - name: Install Playwright browser
        if: steps.backend_paths.outputs.backend == 'true'
        run: npx playwright install --with-deps chromium

      - name: Admin browser contract
        if: steps.backend_paths.outputs.backend == 'true'
        run: npm --prefix workers run test:browser

      - name: Snapshot build contract
        if: steps.backend_paths.outputs.backend == 'true'
        run: node workers/test/snapshot-build.mjs

  docker_build:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, docker/Dockerfile.dynamic]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect container paths
        id: docker_paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'docker/**'
              - '.dockerignore'

      - name: Set up Docker Buildx
        if: steps.docker_paths.outputs.docker == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without push
        if: steps.docker_paths.outputs.docker == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=docker-${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.dockerfile }}

  dependency_audit:
    runs-on: ubuntu-latest
    # dev 依赖的 moderate 告警只提示，不阻断主 CI
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Root dependency audit (including dev)
        # 只记录结果，不因已知的 dev 工具链告警让 PR 出现失败状态
        run: npm audit --audit-level=moderate || true

      - name: Workers dependency audit (including dev)
        run: npm --prefix workers audit --audit-level=moderate || true
