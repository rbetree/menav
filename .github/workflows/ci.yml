name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      browser_contract:
        description: 'Run browser contract with Playwright'
        required: false
        default: false
        type: boolean

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Fast check
        run: npm run check

      - name: Detect browser contract paths
        id: browser_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            browser_contract:
              - 'assets/style.css'
              - 'assets/styles/**'
              - 'assets/pinyin-match.ts'
              - 'config/_default/**'
              - 'src/components/**'
              - 'src/layouts/**'
              - 'src/pages/**'
              - 'src/lib/search-index/**'
              - 'src/runtime/**'
              - 'src/lib/site-model/**'
              - 'src/lib/site-data/**'
              - 'src/lib/config/**'
              - 'src/lib/bookmarks/**'
              - 'src/lib/view-data/**'
              - 'src/types/**'
              - 'src/shared/**'
              - 'content/**'
              - 'scripts/lib/public-assets.ts'
              - 'scripts/lib/runtime-bundle.ts'
              - 'scripts/lib/search-index-assets.ts'
              - 'scripts/build-runtime.ts'
              - 'scripts/prepare-astro-public.ts'
              - 'test/browser/**'

      - name: Install Playwright browsers
        if: ${{ github.repository == 'rbetree/menav' && (steps.browser_paths.outputs.browser_contract == 'true' || (github.event_name == 'workflow_dispatch' && inputs.browser_contract)) }}
        run: npx playwright install --with-deps chromium

      - name: Browser contract
        if: ${{ github.repository == 'rbetree/menav' && (steps.browser_paths.outputs.browser_contract == 'true' || (github.event_name == 'workflow_dispatch' && inputs.browser_contract)) }}
        run: npm run check:browser

  backend_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'npm'
          # 同时缓存根目录与 workers 子目录的依赖
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Install workers dependencies
        run: npm --prefix workers ci

      - name: Install root dependencies
        run: npm ci

      - name: Workers dependency audit
        run: npm --prefix workers audit --audit-level=high

      - name: Workers type check
        run: npm --prefix workers run check

      - name: Workers integration tests
        run: npm run backend:test

      - name: Detect backend paths
        id: backend_paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'workers/**'
              - 'admin/**'
              - 'src/lib/config/**'
              - 'src/lib/bookmarks/**'
              - 'src/lib/security/**'
              - 'src/shared/**'
              - 'src/types/**'
              - 'scripts/build-snapshot.ts'
              - 'scripts/generate-seed.ts'
              - 'scripts/lib/seed.ts'
              - 'config/_default/**'
              - 'content/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'workers/package.json'
              - 'workers/package-lock.json'
              - '.github/workflows/ci.yml'

      - name: Install Playwright browser
        if: steps.backend_paths.outputs.backend == 'true'
        run: npx playwright install --with-deps chromium

      - name: Admin browser contract
        if: steps.backend_paths.outputs.backend == 'true'
        run: npm --prefix workers run test:browser

      - name: Snapshot build contract
        if: steps.backend_paths.outputs.backend == 'true'
        run: node workers/test/snapshot-build.mjs
