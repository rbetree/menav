# 常规版本更新由维护者手动处理：open-pull-requests-limit: 0 关闭常规 PR，安全更新仍由 Dependabot 处理。
# Docker ecosystem 不支持安全更新，limit 0 下新增无意义，故不配置。
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /workers
    target-branch: dev
    schedule:
      interval: monthly
      time: '09:30'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - npm
      - workers
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
      time: '09:15'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
